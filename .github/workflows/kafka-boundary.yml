name: kafka-boundary

on:
  push:
    branches:
      - master
      - kafka
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  downstream-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch canonical upstream mirror
        run: git fetch origin upstream

      - name: Reject downstream edits outside owned paths
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/upstream HEAD)"
          invalid="$(printf '%s\n' "$changed" | grep -Evi '(\.md$|^kafka/|^\.github/workflows/(kafka-[^/]+|upstream-sync)\.ya?ml$)' || true)"

          if [ -n "$invalid" ]; then
            echo "ERROR: downstream changes must stay in owned paths."
            echo "Owned paths: all *.md, kafka/**, kafka-* workflows, upstream-sync workflow."
            echo "Unexpected paths:"
            printf '%s\n' "$invalid"
            exit 1
          fi

          echo "Boundary OK"
          printf '%s\n' "$changed"

      - name: Verify overlay synchronization semantics
        run: bash kafka/test_sync_overlay.sh
